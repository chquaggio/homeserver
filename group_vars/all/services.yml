---
# Service credentials and config (values resolved from vault.yml)

# Actual Budget
actual_budget: "{{ ACTUAL_BUDGET }}"
actual_password: "{{ ACTUAL_PASSWORD }}"
actual_url: "{{ ACTUAL_URL }}"

# Beszel-agent
ba_key: "{{ BA_KEY }}"
ba_token: "{{ BA_TOKEN }}"
beszel_user: "{{ BESZEL_USER }}"
beszel_password: "{{ BESZEL_PASSWORD }}"
beszel_sid: "{{ BESZEL_SID }}"

# Bazarr
bazarr_key: "{{ BAZARR_KEY }}"

# Postgres
db_password: "{{ DB_PASSWORD }}"
db_name: "{{ DB_NAME }}"
db_user: "{{ DB_USER }}"

# Immich
immich_db_password: "{{ IMMICH_DB_PASSWORD }}"

# Jellyfin / Jellyseerr
jellyfin_key: "{{ JELLYFIN_KEY }}"
jellyseerr_key: "{{ JELLYSEERR_KEY }}"

# Mealie
mealie_key: "{{ MEALIE_KEY }}"

# *arr
prowlarr_key: "{{ PROWLARR_KEY }}"
radarr_key: "{{ RADARR_KEY }}"
sonarr_key: "{{ SONARR_KEY }}"

# qBittorrent
qb_user: "{{ QB_USER }}"
qb_password: "{{ QB_PASSWORD }}"

# Proton VPN (gluetun)
protonvpn_key: "{{ PROTONVPN_KEY }}"

# Spesatracker
spesatracker_iper_email: "{{ SPESATRACKER_IPER_EMAIL }}"
spesatracker_iper_psw: "{{ SPESATRACKER_IPER_PSW }}"
spesatracker_iper_store_id: "{{ SPESATRACKER_IPER_STORE_ID }}"
spesatracker_llm_base_url: "http://bestione:8000/v1"
spesatracker_llm_model: "qwen3.8-27b"
spesatracker_llm_timeout: "300"

# Telegram notifications
telegram_token: "{{ TELEGRAM_TOKEN }}"
telegram_chat_id: "{{ TELEGRAM_CHAT_ID }}"

# Trilium
trilium_token: "{{ TRILIUM_TOKEN }}"
trilium_url: "{{ TRILIUM_BASE_URL_PROD }}"

# Vaultwarden
vaultwarden_admin_token: "{{ VAULTWARDEN_ADMIN_TOKEN }}"
# Public origin served through the Cloudflare tunnel
vaultwarden_url: "https://vaultwarden.fantaquoggio.bid"

# VibraVid
vibravid_secret_key: "{{ VIBRAVID_SECRET_KEY }}"
tmdb_key: "{{ TMDB_API_KEY }}"

# WUD
wud_user: "{{ WUD_USER }}"
wud_password: "{{ WUD_PASSWORD }}"

# Zerobyte
zerobyte_secret: "{{ ZEROBYTE_SECRET }}"

# --- karuta ---
karuta_db_password: "{{ KARUTA_DB_PASSWORD }}"
karuta_discord_token: "{{ KARUTA_DISCORD_TOKEN }}"
karuta_discord_client_id: "{{ KARUTA_DISCORD_CLIENT_ID }}"
karuta_discord_client_secret: "{{ KARUTA_DISCORD_CLIENT_SECRET }}"
karuta_session_secret: "{{ KARUTA_SESSION_SECRET }}"
# Discord ids for the karuta game (not secrets)
karuta_guild_id: 687343492636213374
karuta_drop_channel_id: 1526871184396779560
karuta_announce_channel_id: 1526871184396779560
karuta_notify_channel_id: 1526871184396779560
karuta_ping_role_id: 1526876875606196264

# --- FantaQuoggio ---
# Pinned release: a deploy is a bump here, WUD notifies the next vX.Y.Z
fantaquoggio_version: "1.0.0"
fantaquoggio_url: "https://app.fantaquoggio.bid"
fantaquoggio_postgres_password: "{{ FQ_POSTGRES_PASSWORD }}"
fantaquoggio_db_password_owner: "{{ FQ_DB_PASSWORD_OWNER }}"
fantaquoggio_secret_key: "{{ FQ_SECRET_KEY }}"
fantaquoggio_rapidapi_key: "{{ FQ_RAPIDAPI_KEY }}"
fantaquoggio_airflow_jwt_secret: "{{ FQ_AIRFLOW_JWT_SECRET }}"
fantaquoggio_airflow_fernet_key: "{{ FQ_AIRFLOW_FERNET_KEY }}"
fantaquoggio_airflow_ui_password: "{{ FQ_AIRFLOW_UI_PASSWORD }}"
# Amazon SES over SMTP (eu-west-1); empty until the account exists
fantaquoggio_smtp_host: "{{ FQ_SMTP_HOST | default('') }}"
fantaquoggio_smtp_user: "{{ FQ_SMTP_USER | default('') }}"
fantaquoggio_smtp_password: "{{ FQ_SMTP_PASSWORD | default('') }}"
fantaquoggio_emails_from: "noreply@fantaquoggio.bid"
