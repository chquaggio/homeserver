---
- name: Configure VibraVid service
  set_fact:
    vibravid_service:
      name: vibravid
      image: ghcr.io/astraelabs/vibravid:v1.4.8
      container_name: vibravid
      ports:
        - "8001:8000"
      # x265 re-encodes would otherwise take all 4 cores from Jellyfin transcodes
      deploy:
        resources:
          limits:
            cpus: "2.5"
            memory: 3g
      volumes:
        - ./vibravid/conf:/app/Conf
        - ./vibravid/data:/app/data
        - ./vibravid/logs:/app/.cache/logs
        - ./vibravid/binary:/home/appuser/.local/bin/binary
        # Manual GUI downloads land here, visible to the arrs at /downloads
        - "{{ media_dir }}/downloads:/app/Video"
        - "{{ media_dir }}/Movies:/movies"
        - "{{ media_dir }}/Shows:/tv"
      environment:
        - "PUID={{ puid }}"
        - "PGID={{ pgid }}"
        - "TZ={{ tz }}"
        - DJANGO_DEBUG=false
        - DJANGO_DB_DIR=/app/data
        - "DJANGO_SECRET_KEY={{ vibravid_secret_key }}"
        - PYTHONUNBUFFERED=1
        - PYTHONPATH=/app
        - "ALLOWED_HOSTS=localhost,127.0.0.1,vibravid,quoggioserver"
        - "CSRF_TRUSTED_ORIGINS=http://localhost:8001,http://quoggioserver:8001"
        # TMDB is env-only config; enables strict TMDB id matching for arr polling
        - "TMDB_API_KEY={{ tmdb_key }}"
      labels:
        - "wud.link.template=https://github.com/AstraeLabs/VibraVid/releases"
      networks:
        - qnet
      restart: unless-stopped

- name: Setup VibraVid config directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/vibravid/conf"
    owner: "{{ username }}"
    group: "{{ username }}"
    state: directory

- name: Render VibraVid configuration
  ansible.builtin.template:
    src: "templates/vibravid_config.toml.j2"
    dest: "{{ docker_compose_dir }}/vibravid/conf/config.toml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0640"
