---

- name: Setup FantaQuoggio directories
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/fantaquoggio/{{ item }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    state: directory
  loop:
    - data/raw/sofasport
    - data/raw/fantacalcio
    - data/models/mister

- name: Configure FantaQuoggio Postgres
  set_fact:
    fantaquoggio_postgres_service:
      name: fantaquoggio-postgres
      image: postgres:17
      container_name: fantaquoggio-postgres
      environment:
        - POSTGRES_USER=postgres
        - "POSTGRES_PASSWORD={{ fantaquoggio_postgres_password }}"
        - "TZ={{ tz }}"
      ports:
        - "{{ tailscale_ip }}:5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s
      volumes:
        - ./fantaquoggio/postgres_data:/var/lib/postgresql/data
      deploy:
        resources:
          limits:
            memory: 1g
      labels:
        - "wud.link.changelog=https://www.postgresql.org/docs/release/"
      networks:
        - qnet
        - fantaquoggio
      restart: unless-stopped

- name: Configure FantaQuoggio Postgres backup sidecar
  set_fact:
    fantaquoggio_db_backup_service:
      name: fantaquoggio-db-backup
      image: prodrigestivill/postgres-backup-local:17
      container_name: fantaquoggio-db-backup
      depends_on:
        fantaquoggio-db-init:
          condition: service_completed_successfully
      environment:
        - POSTGRES_HOST=fantaquoggio-postgres
        - POSTGRES_DB=fantaquoggio airflow
        - POSTGRES_USER=postgres
        - "POSTGRES_PASSWORD={{ fantaquoggio_postgres_password }}"
        - POSTGRES_EXTRA_OPTS=-Z1 --clean --if-exists --exclude-schema=staging --exclude-schema=intermediate --exclude-schema=marts --exclude-table-data=mister_scenarios.*
        - SCHEDULE=@daily
        - BACKUP_KEEP_DAYS=14
        - BACKUP_KEEP_WEEKS=8
        - BACKUP_KEEP_MONTHS=12
        - "TZ={{ tz }}"
      volumes:
        - ./fantaquoggio/db-backups:/backups
      labels:
        - "wud.link.changelog=https://github.com/prodrigestivill/docker-postgres-backup-local/releases"
      networks:
        - fantaquoggio
      restart: unless-stopped

- name: Configure FantaQuoggio database bootstrap
  set_fact:
    fantaquoggio_db_init_service:
      name: fantaquoggio-db-init
      image: "ghcr.io/chquaggio/fantaquoggio:v{{ fantaquoggio_version }}"
      container_name: fantaquoggio-db-init
      command: sh -c "fq db bootstrap && fq db migrate"
      depends_on:
        fantaquoggio-postgres:
          condition: service_healthy
      environment:
        - "TZ={{ tz }}"
        - "FQ_BOOTSTRAP_DSN=postgresql+psycopg://postgres:{{ fantaquoggio_postgres_password }}@fantaquoggio-postgres:5432/postgres"
        - "FQ_DATABASE_URL=postgresql+psycopg://fq_owner:{{ fantaquoggio_db_password_owner }}@fantaquoggio-postgres:5432/fantaquoggio"
        - "FQ_ROLE_PASSWORD_OWNER={{ fantaquoggio_db_password_owner }}"
      networks:
        - fantaquoggio
      restart: "no"

- name: Configure FantaQuoggio app
  set_fact:
    fantaquoggio_service:
      name: fantaquoggio
      image: "ghcr.io/chquaggio/fantaquoggio:v{{ fantaquoggio_version }}"
      container_name: fantaquoggio
      depends_on:
        fantaquoggio-db-init:
          condition: service_completed_successfully
      environment:
        - "TZ={{ tz }}"
        - "FQ_DATABASE_URL=postgresql+psycopg://fq_owner:{{ fantaquoggio_db_password_owner }}@fantaquoggio-postgres:5432/fantaquoggio"
        - "FQ_SECRET_KEY={{ fantaquoggio_secret_key }}"
        - "FQ_PUBLIC_URL={{ fantaquoggio_url }}"
        - "FQ_SMTP_HOST={{ fantaquoggio_smtp_host }}"
        - "FQ_SMTP_USER={{ fantaquoggio_smtp_user }}"
        - "FQ_SMTP_PASSWORD={{ fantaquoggio_smtp_password }}"
        - "FQ_EMAILS_FROM={{ fantaquoggio_emails_from }}"
      read_only: true
      tmpfs:
        - /tmp
      deploy:
        resources:
          limits:
            memory: 768m
      labels:
        - "wud.link.changelog=https://github.com/chquaggio/FantaQuoggio/releases"
      networks:
        - qnet
        - fantaquoggio
      restart: unless-stopped

- name: Define the FantaQuoggio Airflow base
  set_fact:
    fantaquoggio_airflow_env: &airflow_env
      - "TZ={{ tz }}"
      - "AIRFLOW__CORE__FERNET_KEY={{ fantaquoggio_airflow_fernet_key }}"
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://fantaquoggio-airflow-apiserver:8080/execution/
      - "AIRFLOW__API__BASE_URL=http://{{ tailscale_ip }}:8420"
      - "AIRFLOW__API_AUTH__JWT_SECRET={{ fantaquoggio_airflow_jwt_secret }}"
      - "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://fq_owner:{{ fantaquoggio_db_password_owner }}@fantaquoggio-postgres:5432/airflow"
      - "FQ_DATABASE_URL=postgresql+psycopg://fq_owner:{{ fantaquoggio_db_password_owner }}@fantaquoggio-postgres:5432/fantaquoggio"
      - "FQ_DBT_PASSWORD={{ fantaquoggio_db_password_owner }}"
      - "FQ_RAPIDAPI_KEY={{ fantaquoggio_rapidapi_key }}"
      - "FQ_TELEGRAM_BOT_TOKEN={{ telegram_token }}"
      - "FQ_TELEGRAM_CHAT_ID={{ telegram_chat_id }}"
    fantaquoggio_airflow_base: &airflow
      image: "ghcr.io/chquaggio/fantaquoggio-airflow:v{{ fantaquoggio_version }}"
      user: "{{ puid }}:0"
      labels:
        - "wud.link.changelog=https://github.com/chquaggio/FantaQuoggio/releases"
      networks:
        - qnet
        - fantaquoggio
      restart: unless-stopped

- name: Configure FantaQuoggio Airflow metadata migrations
  set_fact:
    fantaquoggio_airflow_init_service:
      name: fantaquoggio-airflow-init
      container_name: fantaquoggio-airflow-init
      image: "ghcr.io/chquaggio/fantaquoggio-airflow:v{{ fantaquoggio_version }}"
      user: "{{ puid }}:0"
      command: db migrate
      environment: *airflow_env
      volumes:
        - ./fantaquoggio/airflow/logs:/opt/airflow/logs
      depends_on:
        fantaquoggio-db-init:
          condition: service_completed_successfully
      networks:
        - fantaquoggio
      restart: "no"

- name: Configure FantaQuoggio Airflow API server
  set_fact:
    fantaquoggio_airflow_apiserver_service:
      <<: *airflow
      name: fantaquoggio-airflow-apiserver
      container_name: fantaquoggio-airflow-apiserver
      command: ["bash", "/opt/airflow/api-server.sh"]
      environment: "{{ fantaquoggio_airflow_env + ['FQ_AIRFLOW_UI_PASSWORD=' ~ fantaquoggio_airflow_ui_password] }}"
      volumes:
        - ./fantaquoggio/airflow/logs:/opt/airflow/logs
      depends_on:
        fantaquoggio-airflow-init:
          condition: service_completed_successfully
      ports:
        - "{{ tailscale_ip }}:8420:8080"
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 30s
      deploy:
        resources:
          limits:
            memory: 768m

- name: Configure FantaQuoggio Airflow scheduler
  set_fact:
    fantaquoggio_airflow_scheduler_service:
      <<: *airflow
      name: fantaquoggio-airflow-scheduler
      container_name: fantaquoggio-airflow-scheduler
      command: scheduler
      environment: *airflow_env
      depends_on:
        fantaquoggio-airflow-init:
          condition: service_completed_successfully
        fantaquoggio-airflow-apiserver:
          condition: service_healthy
      volumes:
        - ./fantaquoggio/airflow/logs:/opt/airflow/logs
        - ./fantaquoggio/data:/data
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 30s
      deploy:
        resources:
          limits:
            memory: 3g

- name: Configure FantaQuoggio Airflow DAG processor
  set_fact:
    fantaquoggio_airflow_dag_processor_service:
      <<: *airflow
      name: fantaquoggio-airflow-dag-processor
      container_name: fantaquoggio-airflow-dag-processor
      command: dag-processor
      environment: *airflow_env
      volumes:
        - ./fantaquoggio/airflow/logs:/opt/airflow/logs
      depends_on:
        fantaquoggio-airflow-init:
          condition: service_completed_successfully
      healthcheck:
        test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      deploy:
        resources:
          limits:
            memory: 768m
