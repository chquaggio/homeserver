---
- name: Configure Beszel service
  set_fact:
    beszel_service:
      name: beszel
      image: henrygd/beszel:0.18.7
      container_name: beszel
      restart: unless-stopped
      ports:
        - 8090:8090
      volumes:
        - ./beszel/beszel_data:/beszel_data
        - ./beszel/beszel_socket:/beszel_socket
      labels:
        - "wud.link.template=https://github.com/henrygd/beszel/releases"
      networks:
        - qnet

- name: Configure Beszel-agent service
  set_fact:
    beszel_agent_service:
      name: beszel-agent
      image: henrygd/beszel-agent:alpine
      container_name: beszel-agent
      restart: unless-stopped
      # Host networking so network stats are the host's, not the bridge's
      network_mode: host
      user: "0:6"  # root plus the host 'disk' group, for S.M.A.R.T. reads
      devices:
        - /dev/sda:/dev/sda
        - "{{ das_device }}:/dev/sdb"
      cap_add:
        - SYS_RAWIO # required for S.M.A.R.T. data
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ./beszel/beszel_socket:/beszel_socket
        - ./beszel/beszel_agent_data:/var/lib/beszel-agent
        - "{{ media_dir }}:/extra-filesystems/das-01:ro"
      labels:
        - "wud.link.template=https://github.com/henrygd/beszel/releases"
      environment:
        - LISTEN=/beszel_socket/beszel.sock
        - "KEY={{ ba_key }}"
        - "TOKEN={{ ba_token }}"
        # On the host network the hub is reached through its published port
        - HUB_URL=http://localhost:8090
