---
- name: Configure Cloudflared service
  set_fact:
    cloudflared_service:
      name: cloudflared
      image: cloudflare/cloudflared:2026.7.3
      container_name: cloudflared
      command: tunnel --no-autoupdate run
      environment:
        # Env rather than --token so the credential stays out of `ps` on the host
        - "TUNNEL_TOKEN={{ cf_token }}"
      labels:
        - "wud.link.template=https://github.com/cloudflare/cloudflared/releases"
      networks:
        - qnet
      restart: unless-stopped
