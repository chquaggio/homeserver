---
- name: Configure zerobyte service
  set_fact:
    zerobyte_service:
      name: zerobyte
      image: ghcr.io/nicotsx/zerobyte:v0.39.0
      container_name: zerobyte
      environment:
        # Set Backend ENV Variables Here
        - "TZ={{ tz }}"
        - BASE_URL=http://quoggioserver:4096
        - APP_SECRET={{ zerobyte_secret }}
      volumes:
        - /etc/timezone:/etc/timezone:ro
        - /etc/localtime:/etc/localtime:ro
        - /var/lib/zerobyte:/var/lib/zerobyte
        # containers volumes
        - ./actualbudget:/containers/actualbudget
        - ./bazarr/config:/containers/bazarr
        - ./beszel:/containers/beszel
        # Config only. The Calibre library itself lives on the DAS and is bulk;
        # metadata.db is a live SQLite file, so it needs a consistent snapshot
        # rather than a file copy — not solved yet.
        - ./calibre-web-automated/config:/containers/calibre-web-automated
        - ./homepage/config:/containers/homepage
        - ./jellyfin/config:/containers/jellyfin
        - ./jellyseerr/config:/containers/jellyseer
        - ./mealie-data:/containers/mealie
        - ./open-webui:/containers/open-webui
        # Postgres: back up logical dumps (consistent/restorable), NOT the live data
        # dir. Dumps are produced by the db-backup / immich-db-backup sidecars.
        - ./db-backups:/containers/postgres-dumps
        - ./immich/db-backups:/containers/immich-postgres-dumps
        - ./karutuogg/data:/containers/karutuogg-data
        - ./karutuogg/db-backups:/containers/karutuogg-postgres-dumps
        - ./prowlarr/config:/containers/prowlarr
        - ./qbittorrent/config:/containers/qbittorrent
        - ./radarr/config:/containers/radarr
        - ./sonarr/config:/containers/sonarr
        - ./trilium/trilium-data:/containers/trilium
      restart: unless-stopped
      ports:
        - "4096:4096"
      labels:
        - "wud.link.template=https://github.com/nicotsx/zerobyte/releases"
      networks:
        - qnet
