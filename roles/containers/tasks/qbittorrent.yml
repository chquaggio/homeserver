---
- name: Configure qBittorrent service
  set_fact:
    qbittorrent_service:
      name: qbittorrent
      image: lscr.io/linuxserver/qbittorrent:5.2.2
      container_name: qbittorrent
      network_mode: "service:gluetun"
      depends_on:
        gluetun:
          condition: service_healthy
          restart: true
      volumes:
        - ./qbittorrent/config:/config
        - "{{ media_dir }}/downloads:/downloads"
      labels:
        - "wud.link.changelog=https://github.com/qbittorrent/qBittorrent/releases"
      restart: unless-stopped
      environment:
        - "PUID={{ puid }}"
        - "PGID={{ pgid }}"
        - "TZ={{ tz }}"
        - WEBUI_PORT=8585
