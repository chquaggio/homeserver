---
# Every database on the shared instance: the first is the image's default DB, any
# further ones are created by the initdb script; all of them are dumped by the
# sidecar.
- name: List the shared Postgres databases
  set_fact:
    shared_postgres_databases:
      - "{{ db_name }}"

- name: Configure db
  set_fact:
    db_service:
      name: postgres
      image: postgres:17
      container_name: postgres
      environment:
        - POSTGRES_USER={{ db_user }}
        - POSTGRES_PASSWORD={{ db_password }}
        - POSTGRES_DB={{ db_name }}
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s
      volumes:
        - ./postgres_data:/var/lib/postgresql/data
        - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      labels:
        - "wud.link.template=https://www.postgresql.org/docs/release/"
      networks:
        - db-shared

# Logical dump sidecar: writes consistent pg_dump snapshots into a directory that
# Zerobyte backs up. File-level backup of the live data dir is unsafe for a running
# DB (can capture a torn state); these dumps are restorable. Image major version is
# pinned to match the server (postgres:17).
- name: Configure shared Postgres backup sidecar
  set_fact:
    db_backup_service:
      name: db-backup
      image: prodrigestivill/postgres-backup-local:17
      container_name: db-backup
      depends_on:
        - postgres
      environment:
        - POSTGRES_HOST=postgres
        - "POSTGRES_DB={{ shared_postgres_databases | join(' ') }}"
        - "POSTGRES_USER={{ db_user }}"
        - "POSTGRES_PASSWORD={{ db_password }}"
        - POSTGRES_EXTRA_OPTS=--clean --if-exists
        - SCHEDULE=@daily
        - BACKUP_KEEP_DAYS=14
        - BACKUP_KEEP_WEEKS=8
        - BACKUP_KEEP_MONTHS=12
        - "TZ={{ tz }}"
      volumes:
        - ./db-backups:/backups
      labels:
        - "wud.link.template=https://github.com/prodrigestivill/docker-postgres-backup-local/releases"
      networks:
        - db-shared
      restart: unless-stopped

- name: Setup shared Postgres initdb directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/postgres/initdb"
    owner: "{{ username }}"
    group: "{{ username }}"
    state: directory

- name: Render shared Postgres initdb script
  ansible.builtin.template:
    src: postgres-initdb.sh.j2
    dest: "{{ docker_compose_dir }}/postgres/initdb/create-databases.sh"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"
