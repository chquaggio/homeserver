---
- name: Configure Jellyseerr service
  ansible.builtin.set_fact:
    seerr_service:
      name: seerr
      image: ghcr.io/seerr-team/seerr:v3.4.1
      container_name: seerr
      ports:
        - "5055:5055"
      volumes:
        - ./jellyseerr/config:/app/config
      labels:
        - "wud.link.changelog=https://github.com/seerr-team/seerr/releases"
      networks:
        - qnet
      restart: unless-stopped
