---
- name: Configure spesatracker service
  set_fact:
    spesatracker_service:
      name: spesatracker
      image: ghcr.io/chquaggio/spesatracker:latest
      container_name: spesatracker
      restart: unless-stopped
      environment:
        - "TZ={{ tz }}"
        - DB_USER={{ db_user | default('spesatracker') }}
        - DB_PASSWORD={{ db_password }}
        - DB_NAME={{ db_name | default('spesatracker') }}
        - DB_HOST=postgres
        - DOCLING_URL=http://docling:5001
        - TELEGRAM_BOT_TOKEN={{ telegram_token | default('') }}
        - IPER_EMAIL={{ spesatracker_iper_email | default('') }}
        - IPER_PSW={{ spesatracker_iper_psw | default('') }}
        - IPER_STORE_ID={{ spesatracker_iper_store_id | default('') }}
        # LLM receipt parsing / name expansion; empty base URL = regex parser only
        - LLM_BASE_URL={{ spesatracker_llm_base_url | default('') }}
        - LLM_MODEL={{ spesatracker_llm_model | default('') }}
        - LLM_TIMEOUT={{ spesatracker_llm_timeout | default('300') }}
      ports:
        - 8400:8400
      depends_on:
        - postgres
      labels:
        - "wud.link.template=https://github.com/chquaggio/spesatracker/releases"
      networks:
        - qnet
