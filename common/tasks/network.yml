- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present

# Only the tailnet and the LAN may reach host services (sshd included); the
# Cloudflare tunnel is outbound-only, so no inbound 80/443. Published container
# ports are NOT filtered by these rules: Docker inserts its own iptables rules
# ahead of UFW, so a container's `ports:` is reachable on every interface.
- name: Allow all traffic from the tailnet
  ufw:
    rule: allow
    src: 100.64.0.0/10

- name: Allow all traffic from the LAN
  ufw:
    rule: allow
    src: 192.168.1.0/24

- name: Remove world-open rules
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop:
    - { port: '22', proto: tcp }
    - { port: '53', proto: tcp }
    - { port: '53', proto: udp }

- name: Enable UFW with default deny
  ufw:
    state: enabled
    policy: deny

- name: Disable root SSH login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-no-root-login.conf
    content: "PermitRootLogin no\n"
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
